*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--wm);background-size:330px 290px;background-attachment:fixed;color:var(--ink);font:400 14px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1100px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-block:20px 12px}
h1{font:700 26px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
header.brand{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:var(--brand);color:var(--brand-ink);border-radius:0 0 12px 12px;padding:14px 18px;margin:0 -2px 12px}
header.brand h1{color:var(--brand-ink);font-size:24px}
header.brand .sub{color:var(--brand-sub);margin-top:2px}
header.brand .logo{width:64px;height:auto;border-radius:50%;flex:none;background:#c6dfe2}
.grp{background:var(--soft);font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px 12px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav.tabs button{font:500 14px var(--f-body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge-n{font:500 11px var(--f-mono);background:var(--crit-bg);color:var(--crit);border-radius:9px;padding:1px 6px;margin-left:5px}
section[hidden]{display:none}
h2{font:700 17px/1.2 var(--f-display);margin:0 0 12px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.kpi .l{font:500 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .v{font:500 24px/1.2 var(--f-mono);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.pill{display:inline-block;font:500 12px var(--f-body);padding:2px 9px;border-radius:10px}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.crit{background:var(--crit-bg);color:var(--crit)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
/* barras */
.hb{display:grid;grid-template-columns:minmax(80px,150px) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{background:var(--soft);height:10px;border-radius:5px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hb button.lab{background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.hb button.lab:hover{color:var(--accent);text-decoration:underline}
.cols{display:flex;gap:6px;align-items:flex-end;height:190px;border-bottom:1px solid var(--line);position:relative;padding-top:8px}
.cols .c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center}
.cols .b{width:100%;max-width:34px;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px}
.cols .b.off{background:var(--soft)}
.cols .t{font:400 10px var(--f-mono);color:var(--muted);margin-bottom:3px;white-space:nowrap}
.cl{display:flex;gap:6px;margin-top:4px}.cl span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 8px}
.stack i{display:block}
/* controles */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
input,select,textarea{font:400 14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input.search{flex:1 1 240px;font-size:16px;padding:10px 12px}
.chip{font:500 13px var(--f-body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{font:500 14px var(--f-body);background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:500 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid var(--soft);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.go{cursor:pointer}tbody tr.go:hover td{background:var(--soft)}
th.r{text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted)}
.mono{font-family:var(--f-mono)}
/* recibo */
.rg{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:820px){.rg{grid-template-columns:minmax(0,1fr)}}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:24px 26px;box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(0,0,0,.35)}
.paper .hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.paper .t1{font:700 19px/1.15 var(--f-display)}
.paper .meta{font:400 12px var(--f-mono);color:var(--muted);text-align:right}
.paper .casa{font:700 34px/1 var(--f-display)}
.paper h3{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px}
.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dotted var(--line)}
.line span:first-child{min-width:0}
.line .sm{display:block;color:var(--muted);font-size:12px}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:16px;padding-top:10px;font:700 18px var(--f-display)}
.tot .mono{font-size:22px}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.months div{border-radius:6px;padding:5px 2px;text-align:center;font:500 11px var(--f-mono);border:1px solid var(--line);color:var(--muted)}
.months div b{display:block;font-weight:500;font-size:12px}
.months .ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.months .part{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.months .no{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.months .fut{opacity:.55}
.side{display:grid;gap:16px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.sev{display:flex;gap:10px;align-items:flex-start}
.ins{display:grid;gap:10px}
.ins .it{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.ins .it .h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:600}
.ins .it .d{color:var(--muted);font-size:13px}
.ins .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ins .chips button{font:500 12px var(--f-mono);background:var(--soft);color:var(--ink);border:0;border-radius:5px;padding:2px 7px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20}
table.yt td.cm{text-align:right;font:400 11px var(--f-mono);padding:6px 6px;min-width:34px}
table.yt th{padding:8px 6px}
td.cm.ok{background:var(--good-bg);color:var(--good)}td.cm.part{background:var(--warn-bg);color:var(--warn)}td.cm.no{background:var(--crit-bg);color:var(--crit)}td.cm.fut{color:var(--muted)}
details summary{list-style:revert}
#modal:empty{display:none}
.mdl{position:fixed;inset:0;z-index:30;background:rgba(5,25,35,.62);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mdl .box{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:min(100%,720px);max-height:100%;overflow:auto;padding:18px}
.mdl .opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0}
.pv{background:#ffffff;color:#0c3b51;border:1px solid #c7d2dd;border-radius:3px;padding:14px;margin:8px auto 12px;font:12px/1.4 var(--f-body);overflow:hidden}
.pv .r{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.pv .r b{font-weight:600}.pv .g{color:#566871;font-size:11px}
.pv h4{margin:10px 0 2px;font:600 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:#566871}
.pv .tt{border-top:2px solid #0c3b51;margin-top:8px;padding-top:6px;font:700 15px var(--f-display)}
@media(max-width:820px){
  input,select,textarea{font-size:16px}
  .paper{padding:18px 16px}
  .kpi .v{font-size:21px}
  h1{font-size:22px}
  header.brand{padding:12px 14px}
}
@media(max-width:640px){
  table.stk,table.stk tbody{display:block}
  table.stk thead{display:none}
  table.stk tr{display:grid;grid-template-columns:34px 1fr auto;gap:4px 8px;padding:10px 10px;border-bottom:1px solid var(--soft);align-items:center}
  table.stk td{display:block;padding:0;border:0;min-width:0}
  table.stk td.grp{grid-column:1/-1;padding:6px 10px;margin:0 -10px}
  table.stk td:nth-child(1){grid-row:1/3}
  table.stk td:nth-child(2){grid-column:2/4}
  table.stk td:nth-child(3){grid-column:2;text-align:left;font-size:13px}
  table.stk td:nth-child(3)::before{content:attr(data-l);color:var(--muted);font-family:var(--f-body)}
  table.stk td:nth-child(4){grid-column:3}
  table.stk td input[type=number]{width:104px!important}
  .form{grid-template-columns:1fr 1fr}
  .bar .btn{flex:1 1 auto}
  .toast{max-width:calc(100% - 32px);text-align:center}
  header.brand .logo{width:52px}
  #sync{display:none}
}
@media(max-width:420px){.form{grid-template-columns:1fr}.months{grid-template-columns:repeat(4,1fr)}}
@media(pointer:coarse){
  .btn{min-height:42px}.btn.sm{min-height:36px}.chip{min-height:38px;padding:6px 14px}
  input[type=checkbox]{width:22px;height:22px}
  nav.tabs button{padding:12px 16px}
  .ins .chips button{padding:5px 9px}
}
nav.tabs{-webkit-overflow-scrolling:touch;scrollbar-width:thin}
table.rpt{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
table.rpt th{position:sticky;top:0;z-index:2}
table.rpt td{padding:0;border-bottom:1px solid var(--soft);border-right:1px solid var(--soft)}
table.rpt td.rc{text-align:center;font:400 11px var(--f-mono);height:26px;min-width:40px}
table.rpt td.rc.ok{background:var(--accent);color:var(--accent-ink)}
table.rpt td.rc.par{background:var(--warn);color:#fff}
table.rpt td.rc.fut,table.rpt td.rc.tot{background:var(--soft);color:var(--muted)}
table.rpt td.rc.no{background:transparent}
table.rpt td:first-child{text-align:center;padding:2px 4px}
table.rpt td.num{padding:0 8px}
table.rpt tr.rt td{font-weight:600;background:var(--soft)}
span.rc.ok{background:var(--accent)}span.rc.par{background:var(--warn)}span.rc.fut{background:var(--soft)}span.rc.no{background:#fff}
@media(max-width:640px){table.rpt td.rc{min-width:34px;font-size:10px}}

.cp{background:#fff;color:#2b4c9b;border:1px solid #c7d2dd;max-width:780px;margin:12px auto;position:relative;font:14px/1.55 var(--f-body);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.cp .band{background:#ea4e4e;min-height:70px;margin-left:96px;display:flex;align-items:center;padding:8px 18px;color:#fff;font:700 clamp(14px,3.4vw,22px)/1.15 var(--f-display);text-transform:uppercase}
.cp .lg{position:absolute;left:14px;top:6px;width:92px;height:92px;border-radius:50%;box-shadow:0 0 0 5px #ea4e4e}
.cp h3{margin:26px 24px 0 112px;font:700 clamp(16px,3.6vw,22px) var(--f-display);color:#2b4c9b;letter-spacing:.02em;border-bottom:5px solid #ea4e4e;padding-bottom:6px}
.cp .dt{margin:10px 24px 0 112px;text-align:right;font-size:12px;text-transform:uppercase}
.cp .bd{display:grid;grid-template-columns:150px 1fr;gap:0 18px;padding:18px 24px 30px 16px}
.cp .sd{border-top:5px solid #ea4e4e;padding-top:12px;font-size:13px;white-space:pre-line;align-self:start;margin-top:6px}
.cp .tx p{margin:0 0 14px}
.cp .sg{height:62px;margin:4px 0 0}
.cp .ln{width:230px;border-top:1px solid #2b4c9b;margin:6px 0 6px}
.cp .nm{font-size:13px;text-transform:uppercase}
@media(max-width:640px){.cp .bd{grid-template-columns:1fr;padding:14px 16px 24px}.cp .band{margin-left:80px}.cp .lg{width:74px;height:74px}.cp h3,.cp .dt{margin-left:92px;margin-right:16px}}

(function(){
  var cfg=window.FIREBASE_CONFIG;
  if(window.claude||!cfg||!cfg.apiKey||String(cfg.apiKey).indexOf('PEGA')===0||typeof firebase==='undefined')return;
  firebase.initializeApp(cfg);

  ov.innerHTML='<form id="lgf" style="background:#fff;border-radius:14px;padding:24px;width:100%;max-width:340px;display:grid;gap:12px"><h2 style="margin:0;font-size:20px">Plaza de los Patos</h2><div style="color:#555">Inicia sesion para continuar</div><input id="lge" type="email" autocomplete="username" placeholder="Correo" required style="padding:12px;border:1px solid #bbb;border-radius:8px;font-size:16px"><input id="lgp" type="password" autocomplete="current-password" placeholder="Contrasena" required style="padding:12px;border:1px solid #bbb;border-radius:8px;font-size:16px"><button style="padding:12px;border:0;border-radius:8px;background:#1b6b57;color:#fff;font-size:16px">Entrar</button><div id="lgm" style="color:#b00020;min-height:18px"></div></form>';

      auth.signInWithEmailAndPassword(ov.querySelector('#lge').value.trim(),ov.querySelector('#lgp').value).catch(function(){ov.querySelector('#lgm').textContent='Correo o contrasena incorrectos'})}});
  var ready=new Promise(function(res){auth.onAuthStateChanged(function(u){

})();

    } else (ab[p.casa]??=[]).push(p);
  }
  return D.casas.map(h=>{
    const yd={},my={};
    for(let y=Y0;y<=CY;y++){yd[y]=cuotaYear(h,y,(ov[y]||{})[h.c]||{});my[y]=yd[y].m}
    const {m,raw,venc,recM,owed}=yd[CY];
    const v26=venc.reduce((s,x)=>s+x.falta,0);
    const recT=recM.reduce((s,x)=>s+x.rec,0);
    const abonos=(ab[h.c]||[]);
    const ajustes=S.aj.filter(a=>a.casa===h.c);const ajT=sum(ajustes.map(a=>a.tipo==='condonacion'?-a.monto:a.monto));
    const abT=abonos.reduce((s,x)=>s+x.monto,0);
    // asignación de abonos por mes, año o proyecto; lo no asignado se aplica a lo más antiguo
    const asgY={},asgM={},asgP={};let pool=0;
    for(const a of abonos){
      if(a.tipo==='historico'&&a.anio>0){
        if(a.mesH>=0)asgM[a.anio+'-'+a.mesH]=(asgM[a.anio+'-'+a.mesH]||0)+a.monto;
        else asgY[a.anio]=(asgY[a.anio]||0)+a.monto;
      }
      else if(a.tipo==='proyecto'&&a.proy>=0)asgP[a.proy]=(asgP[a.proy]||0)+a.monto;
      else pool+=a.monto;
    }
    const fin=x=>{x.abon=sum(x.meses.map(m=>m.abon));x.rem=sum(x.meses.map(m=>m.rem));x.pend=x.meses.filter(m=>m.rem>0)};
    const srcs=h.y.map((n,i)=>{
      if(!(n>0))return null;
      const y=YEARS[i],rate=RATE[i];
      let meses=(D.luz[y][h.c-1]||[]).map((v,k)=>v?null:k).filter(k=>k!==null).map(k=>({i:k,amt:rate,abon:0,rem:rate}));
      if(meses.length!==n)meses=Array.from({length:n},()=>({i:-1,amt:rate,abon:0,rem:rate}));
      return {y,n,rate,meses};
    }).filter(Boolean);
    // años cerrados desde la hoja base: lo que quedó sin pagar pasa solo a cuotas atrasadas
    for(let y=Y0;y<CY;y++){
      const meses=yd[y].owed.map((o,i)=>({i,amt:o.falta+o.rec,abon:0,rem:o.falta+o.rec})).filter(mm=>mm.rem>0.001);
      if(meses.length)srcs.push({y,n:meses.length,rate:yd[y].rate,meses});
    }
    let histY=srcs.map(({y,n,rate,meses})=>{
      let ex=0;
      for(const m of meses){const key=y+'-'+m.i;const as=asgM[key]||0;if(as){const k=Math.min(m.rem,as);m.abon+=k;m.rem-=k;ex+=as-k;delete asgM[key]}}
      let ya=asgY[y]||0;delete asgY[y];
      for(const m of meses){const k=Math.min(m.rem,ya);m.rem-=k;m.abon+=k;ya-=k}
      const x={y,n,rate,amt:sum(meses.map(m=>m.amt)),meses,ex:ex+ya};fin(x);return x;
    });
    pool+=sum(Object.values(asgY))+sum(Object.values(asgM));
    let proy=h.p.map((f,i)=>{const as=asgP[i]||0;delete asgP[i];return f?{i,name:D.pn[i],cost:D.pc[i],abon:Math.min(D.pc[i],as),rem:Math.max(0,D.pc[i]-as),ex:Math.max(0,as-D.pc[i])}:null}).filter(Boolean);
    pool+=sum(Object.values(asgP))+sum(histY.map(x=>x.ex))+sum(proy.map(x=>x.ex));
    for(const x of histY){for(const m of x.meses){const k=Math.min(pool,m.rem);m.rem-=k;m.abon+=k;pool-=k}fin(x)}
    for(const x of proy){const k=Math.min(pool,x.rem);x.rem-=k;x.abon+=k;pool-=k}
    histY=histY.filter(x=>x.rem>0);proy=proy.filter(x=>x.rem>0);
    const hist=sum(histY.map(x=>x.rem)),proyT=sum(proy.map(x=>x.rem));
    const bruto=hist+proyT+v26+recT;
    const credito=Math.min(pool,bruto),saldoFavor=Math.max(0,pool-bruto);
    const total=Math.max(0,bruto-credito+ajT);
    const histMeses=sum(srcs.map(x=>x.n));
    const estado=total<=0?'ok':(total>=CRIT?'crit':'warn');
    return {c:h.c,ajustes,ajT,m,my,raw,histY,hist,histMeses,proy,proyT,venc,v26,recM,recT,owed,abonos,abT,bruto,credito,total,estado,saldoFavor};
  });
}

function cobranza(){
  const out=[];
  for(let i=0;i<12;i++){let s=0;for(const r of R)s+=Math.min(r.m[i],1e9);out.push(s)}

}

/* ---------- buscador ---------- */
function filtered(){
  const q=S.q.trim().toLowerCase();
  let L=R.filter(r=>{
    if(S.filt==='ok'&&r.estado!=='ok')return false;
    if(S.filt==='warn'&&r.estado!=='warn')return false;
    if(S.filt==='crit'&&r.estado!=='crit')return false;
    if(S.filt==='hist'&&!(r.hist>0))return false;
    if(S.filt==='proy'&&!r.proy.length)return false;
    if(S.filt==='nohab'&&String(D.aut20[r.c-1].hab).toUpperCase()==='SI')return false;
    const mL=q.match(/^(?:llavero|tag|l)\s*(\d+)$/);
    if(mL)return D.peat[r.c-1].ll.includes(+mL[1]);
    if(q){
      const nums=q.split(/[\s,]+/).filter(Boolean);
      const hay=[String(r.c),'casa '+r.c,ESTADO[r.estado][0].toLowerCase(),...r.proy.map(p=>p.name.toLowerCase())].join(' | ');
      if(!nums.some(n=>/^\d+$/.test(n)?String(r.c)===n||(n.length>=1&&String(r.c).startsWith(n)&&n.length>=2):hay.includes(n)))return false;
    }
    return true;
  });
  if(S.sort==='deuda')L.sort((a,b)=>b.total-a.total);
  else if(S.sort==='meses')L.sort((a,b)=>(b.histMeses+b.venc.length)-(a.histMeses+a.venc.length));
  return L;
}

const isoHoy=()=>NOW.getFullYear()+'-'+pad(NOW.getMonth()+1)+'-'+pad(NOW.getDate());
function pendItems(r,f='atrasado'){
  const yy=NOW.getFullYear(),items=[],hoy=isoHoy(),want=g=>f==='atrasado'||f==='todo'||f===g;
  if(want('cuota26'))for(let i=0;i<12;i++){

    if(i<=CURM){
      const s=o.falta+o.rec;if(s<=0)continue;
      const dias=Math.floor((new Date(hoy+'T12:00:00')-new Date(dl+'T12:00:00'))/864e5);
      items.push({g:`Cuotas ${yy}: meses vencidos y mes corriente`,k:'m'+i,tipo:'cuota26',mes:i,label:`${MES[i]} ${yy}`,amt:s,sub:dias>0?`Venció el ${fecha(dl)} · ${dias} día${dias>1?'s':''} de atraso${o.rec?' · incluye recargo '+money(o.rec):''}`:`Vence el ${fecha(dl)}`});
    }else if((f==='cuota26'||f==='todo')&&o.falta>0)items.push({g:`Cuotas ${yy}: por vencer (pago adelantado)`,k:'m'+i,tipo:'cuota26',mes:i,label:`${MES[i]} ${yy}`,amt:o.falta,sub:`Vence el ${fecha(dl)}`});
  }
  if(want('historico'))for(const x of r.histY){
    const k='y'+x.y;

      children:x.pend.map(m=>({k:k+'-'+m.i,parent:k,tipo:'historico',anio:x.y,mesH:m.i,label:m.i>=0?`${MES[m.i]} ${x.y}`:`Mes pendiente ${x.y}`,amt:m.rem,sub:''}))});
  }

  return items;
}

function exclusivo(items,k){const n=selNode(items,k);if(!n)return;if(n.parent)S.sel[n.parent]=false;for(const c of n.children||[])S.sel[c.k]=false}

const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function toIso(v){
  if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()+12*3600e3).toISOString().slice(0,10);
  const s=String(v??'').trim();if(!s)return isoHoy();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);if(m)return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  return isoHoy();
}
function parseRows(rows){
  const hdr=(rows[0]||[]).map(norm);
  const col=a=>hdr.findIndex(h=>a.some(x=>h.includes(x)));
  const ci={casa:col(['casa']),tipo:col(['concepto','tipo']),mes:col(['mes']),monto:col(['monto','importe']),fecha:col(['fecha']),nota:col(['nota','observ'])};
  const mn=MES.map(norm);
  return rows.slice(1).filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>{
    const g=k=>ci[k]>=0?r[ci[k]]:'';
    const casa=parseInt(g('casa'),10),monto=parseFloat(String(g('monto')).replace(/[$,\s]/g,''));
    const tr=norm(g('tipo'));let mes=-1;const mr=g('mes');
    if(String(mr).trim()!==''){const n=parseInt(mr,10);mes=!isNaN(n)&&n>=1&&n<=12?n-1:mn.findIndex(x=>x.startsWith(norm(mr).slice(0,3)))}
    let tipo=tr.includes('atras')||tr.includes('hist')?'historico':tr.includes('proy')?'proyecto':tr.includes('cuota')||tr.includes('mens')?'cuota26':(mes>=0?'cuota26':'historico');
    let err='';
    if(!(casa>=1&&casa<=D.casas.length))err='Casa inválida';else if(!(monto>0))err='Monto inválido';else if(tipo==='cuota26'&&mes<0)err='Falta el mes';
    const ym=tipo==='historico'?(tr.match(/20\d\d/)||[])[0]:null;
    return {casa:isNaN(casa)?String(g('casa')):casa,tipo,tipoRaw:String(g('tipo')),mes:tipo==='cuota26'?mes:-1,ay:tipo==='cuota26'?CY:undefined,anio:ym?+ym:-1,proy:-1,monto:isNaN(monto)?0:monto,montoRaw:String(g('monto')),fecha:toIso(g('fecha')),nota:String(g('nota')||'').trim(),err};
  });
}
function readImport(f){
  if(!f)return;
  const rd=new FileReader();
  if(/\.csv$/i.test(f.name)){
    rd.onload=()=>{S.imp=parseRows(csvRows(String(rd.result)));render()};rd.readAsText(f);
  }else{
    if(typeof XLSX==='undefined'){toast('No se pudo cargar el lector de Excel. Usa un archivo CSV.');return}
    rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];S.imp=parseRows(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}));render()}catch(e){toast('No se pudo leer el archivo')}};rd.readAsArrayBuffer(f);
  }
}
function csvRows(s){
  const rows=[];let row=[],cur='',q=false;s=s.replace(/^\ufeff/,'');
  const sep=(s.split('\n')[0].match(/;/g)||[]).length>(s.split('\n')[0].match(/,/g)||[]).length?';':',';
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'&&s[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows;
}

function inconsist(){
  const out=[];
  const sinPago=[],atip=[],saltos=[],adelant=[];
  for(const r of R){
    const raw=r.raw;
    if(CURM>=0&&raw.slice(0,CURM+1).every(v=>!v))sinPago.push(r.c);
    raw.forEach((v,i)=>{
      if(v>0&&v!==CUOTA)atip.push({c:r.c,i,v});
      if(i>CURM&&v>0)adelant.push({c:r.c,i});
    });
    let seen0=false,gap=[];
    for(let i=0;i<=CURM;i++){if(!raw[i])seen0=true;else if(seen0&&raw[i]){gap.push(i)}}
    if(gap.length)saltos.push(r.c);
  }
  if(sinPago.length)out.push({sev:'crit',t:`${sinPago.length} casas sin ningún pago de cuota en ${NOW.getFullYear()}`,d:'No registran pago en ningún mes transcurrido. Confirmar si están deshabitadas, en convenio o si falta capturar pagos.',casas:sinPago});
  const R_=recMonto();const conRec=atip.filter(x=>x.i>=CFG.desde&&Math.abs(x.v-(CUOTA+R_))<0.01);const parc=atip.filter(x=>x.v<CUOTA),exc=atip.filter(x=>x.v>CUOTA&&!conRec.includes(x));
  if(parc.length)out.push({sev:'warn',t:`${parc.length} pagos parciales`,d:'Importe menor a '+money(CUOTA)+'. El faltante se suma al adeudo: '+parc.map(x=>`casa ${x.c} ${M3[x.i]} ${money(x.v)}`).join('; ')+'.',casas:parc.map(x=>x.c)});
  if(conRec.length)out.push({sev:'info',t:`${conRec.length} cuotas pagadas con recargo de ${CFG.pct}% (${money(CUOTA+R_)})`,d:`Cuota de ${money(CUOTA)} más ${money(R_)} de recargo en ${[...new Set(conRec.map(x=>M3[x.i]))].join(', ')}. Coincide con la regla vigente desde ${MES[CFG.desde]}.`,casas:[...new Set(conRec.map(x=>x.c))]});
  if(exc.length)out.push({sev:'warn',t:`${exc.length} pagos con importe distinto a la cuota`,d:'Importes que no son la cuota ni cuota con recargo: '+exc.map(x=>`casa ${x.c} ${M3[x.i]} ${money(x.v)}`).join('; ')+'.',casas:[...new Set(exc.map(x=>x.c))]});
  const rp=R.filter(r=>r.recT>0);
  if(rp.length)out.push({sev:'warn',t:`${rp.length} casas con recargo por morosidad pendiente (${money(sum(rp.map(r=>r.recT)))})`,d:`Recargo de ${CFG.pct}% (${money(R_)} por cuota vencida) desde ${MES[CFG.desde]} ${NOW.getFullYear()}. Se considera vencida la cuota después del día ${CFG.dia} de su mes.`,casas:rp.map(r=>r.c)});
  if(saltos.length)out.push({sev:'warn',t:`${saltos.length} casas con meses saltados`,d:'Dejaron un mes sin pago y pagaron meses posteriores. Revisar si el pago se capturó en el mes equivocado.',casas:saltos});
  if(adelant.length){const cs=[...new Set(adelant.map(x=>x.c))];out.push({sev:'info',t:`${cs.length} casas con pagos adelantados`,d:'Tienen cuotas pagadas de meses que aún no vencen. No generan adeudo.',casas:cs})}
  const ceros=GCY.filter(g=>!g.m),dup={};for(const g of GCY){const k=g.f+g.c+g.m;dup[k]=(dup[k]||0)+1}
  const dups=Object.entries(dup).filter(([k,v])=>v>1);
  if(ceros.length)out.push({sev:'warn',t:`${ceros.length} gastos con importe $0`,d:`Concepto "${ceros[0].c}" desde ${fecha(ceros[0].f)}. Si el riego dejó de cobrarse, eliminar las filas; si sigue, falta capturar el importe.`});
  if(dups.length)out.push({sev:'info',t:`${dups.length} gasto repetido (misma fecha, concepto e importe)`,d:'Puede ser un doble registro: '+dups.map(([k])=>{const g=GCY.find(x=>x.f+x.c+x.m===k);return `${g.c} ${fecha(g.f)} ${money(g.m)}`}).join('; ')+'.'});
  out.push({sev:'info',t:`${GCY.filter(g=>!g.a&&!g.d).length} de ${GCY.length} gastos ${NOW.getFullYear()} sin área ni descripción`,d:'En la hoja de gastos solo se captura el concepto. Sin área no se puede saber cuánto cuesta cada zona del condominio.'});
  const disp=finanzas().disp;
  if(disp<0)out.push({sev:'crit',t:`Fondo ${NOW.getFullYear()} en negativo: ${mx(disp)}`,d:`Los gastos (${money(YT[CY],2)}) ya superan lo cobrado más remanente y adicional. Las cuotas por vencer no cubren el faltante si el ritmo de gasto continúa.`});
  // llaveros
  const cnt={};D.peat.forEach((x,i)=>x.ll.forEach(n=>(cnt[n]??=[]).push(i+1)));
  const dl=Object.entries(cnt).filter(([n,c])=>c.length>1);
  if(dl.length)out.push({sev:'crit',t:`${dl.length} números de llavero repetidos en distintas casas`,d:'El mismo llavero aparece asignado a más de una casa: '+dl.map(([n,c])=>`#${n} en casas ${c.join(' y ')}`).join('; ')+'. Verificar cuál es la casa correcta para evitar accesos sin control.',casas:[...new Set(dl.flatMap(([n,c])=>c))]});
  const sl=D.peat.map((x,i)=>x.ll.length?0:i+1).filter(Boolean);
  if(sl.length)out.push({sev:'warn',t:`${sl.length} casas sin llavero TAG registrado`,d:'Pagaron el TAG de la puerta peatonal pero no tienen número de llavero anotado.',casas:sl});
  const nh=R.filter(r=>String(D.aut20[r.c-1].hab).toUpperCase()!=='SI');
  const nhd=nh.filter(r=>r.total>0);
  if(nh.length)out.push({sev:'info',t:`${nh.length} casas marcadas como deshabitadas`,d:`${nhd.length} de ellas tienen adeudo vigente (${money(sum(nhd.map(r=>r.total)))}). Conviene ubicar al propietario para el cobro.`,casas:nh.map(r=>r.c)});
  // totales de hoja vs suma por casa
  const chk=[['Aportación 2º proyecto',27035,sum(D.apor1)],['Reestructuración de portón',6400,sum(D.reest.map(sum))],['Automatización 2018',6500,sum(D.aut18)],['Seguridad 2021',27776,sum(D.seg)],['Inspección y fugas',23884,sum(D.fuga.map(sum))],['Pistón Erreka',12400,sum(D.pist)],['Puerta peatonal',16815,sum(D.peat.map(x=>x.apor))],['Automatización y cámaras 2020',77372.43,sum(D.aut20.map(x=>x.tot))]];
  const bad=chk.filter(([n,a,b])=>Math.abs(a-b)>1);
  if(bad.length)out.push({sev:'warn',t:`${bad.length} totales de la hoja no cuadran con la suma por casa`,d:bad.map(([n,a,b])=>`${n}: hoja ${money(a)} contra suma ${money(b)} (diferencia ${money(a-b)})`).join('; ')+'.'});
  const ord={crit:0,warn:1,info:2};out.sort((a,b)=>ord[a.sev]-ord[b.sev]);
  return out;
}

function ultCuota(c){
  const t=p=>p.ts||Date.parse(p.fecha||'')||0;
  const own=S.pagos.filter(p=>p.casa===c&&(p.tipo==='cuota26'||p.tipo==='historico'));
  if(!own.length)return [];
  const last=own.reduce((a,b)=>t(b)>t(a)?b:a);
  const lt=t(last);
  return own.filter(p=>last.ts?Math.abs(t(p)-lt)<=120000:p.fecha===last.fecha).sort((a,b)=>(a.mes??0)-(b.mes??0));
}

async function repExport(act){

  const m=repModel(k);
  let cv;try{cv=await repCanvas(m)}catch(e){return toast('No se pudo generar la imagen')}
  const blob=()=>new Promise(r=>cv.toBlob(r,'image/png'));
  if(act==='png'){const b=await blob();return saveFile(m.file+'.png',await b.arrayBuffer())}
  if(act==='copy'){
    try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob()})]);toast('Imagen copiada. Pégala en WhatsApp')}

  }
  if(act==='pdf'){

    try{
      const J=window.jspdf.jsPDF,W=215.9,H=279.4,mg=8,pdf=new J({unit:'mm',format:[W,H]});
      const ar=cv.width/cv.height;let w=W-2*mg,h=w/ar;if(h>H-2*mg){h=H-2*mg;w=h*ar}
      pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',(W-w)/2,mg,w,h);

    }catch(e){toast('No se pudo generar el PDF')}
  }
}

const fmtTel=s=>{const d=String(s||'').replace(/\D/g,'');return d.length===10?`${d.slice(0,2)} ${d.slice(2,6)} ${d.slice(6)}`:String(s||'').trim()};

function dirLista(){
  const q=DS.q.trim().toLowerCase();
  return R.filter(r=>{
    const o=DIR[r.c]||{};

async function dirPdf(){

    pdf.setFont('helvetica','bold');pdf.setTextColor(...ink);pdf.setFontSize(17);pdf.text('Directorio de vecinos',hx,y+7);

  cab();
  for(const o of filas){
    const nl=pdf.splitTextToSize(safe(o.n||'-'),W-2*m-20-56),tl=[o.t,o.t2].filter(Boolean).map(fmtTel),n=Math.max(nl.length,tl.length,1),h=n*5+3;
    if(y+h>H-m-6){pdf.setFontSize(8);pdf.setTextColor(...mut);pdf.text('Página '+pg,W/2,H-8,{align:'center'});pdf.addPage();pg++;cab()}
    pdf.setFont('helvetica','bold');pdf.setFontSize(11);pdf.setTextColor(...ink);pdf.text(String(o.c),m,y);
    pdf.setFont('helvetica','normal');pdf.setFontSize(10.5);pdf.text(nl,m+20,y);
    pdf.setFont('courier','normal');pdf.setFontSize(10.5);tl.forEach((x,i)=>pdf.text(safe(x),W-m-52,y+i*5));
    y+=h-1;pdf.setDrawColor(225,232,238);pdf.setLineWidth(.15);pdf.line(m,y,W-m,y);y+=4;
  }
  pdf.setFontSize(8);pdf.setTextColor(...mut);pdf.text('Página '+pg,W/2,H-8,{align:'center'});
  await saveFile('directorio-plaza-patos.pdf',pdf.output('arraybuffer'));
}
async function dirImport(f){
  if(!f)return;
  try{
    let rows;
    if(/\.csv$/i.test(f.name)){
      const m=csvRows(await f.text()),h=m[0]||[];
      rows=m.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])));
    }else{
      if(!window.XLSX)return toast('No se pudo cargar el lector de Excel. Usa un archivo CSV.');
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
    }
    const nk=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
    const MAP={casa:'c',numerocasa:'c',no:'c',numero:'c',nombre:'n',vecino:'n',propietario:'n',residente:'n',telefono:'t',tel:'t',celular:'t',telefono1:'t',whatsapp:'t',telefono2:'t2',tel2:'t2',celular2:'t2',telefonoalterno:'t2',correo:'e',email:'e',correoelectronico:'e',notas:'nt',nota:'nt',observaciones:'nt'};
    let n=0,mal=0;
    for(const row of rows){
      const o={};for(const [k,v] of Object.entries(row)){const m=MAP[nk(k)];if(m)o[m]=String(v).trim()}
      const c=parseInt(String(o.c||'').replace(/\D/g,''),10);
      if(!(c>=1&&c<=D.casas.length)){if(Object.values(row).some(x=>String(x).trim()))mal++;continue}
      const nuevo={n:o.n||'',t:o.t||'',t2:o.t2||'',e:o.e||'',nt:o.nt||''};
      if(Object.values(nuevo).some(x=>x)){DIR[c]={...(DIR[c]||{}),...Object.fromEntries(Object.entries(nuevo).filter(([,v])=>v))};n++}
    }
    await saveDir();render();
    toast(n?`Se cargaron ${n} contactos${mal?` · ${mal} filas sin número de casa válido`:''}`:'No se encontraron filas con número de casa válido');
  }catch(e){toast('No se pudo leer el archivo')}
}

let CARTA={cond:'CONDOMINIO PLAZA DE LOS PATOS.',ciudad:'Santiago de Querétaro, Qro.',dir:'Laures 93\nGeo plazas Querétaro qro.\n76116',firmante:'ULISES AVILA L.',tel:'4422555353',cargo:'ADMINISTRACION'};
const CS={mes:CURM>=0?CURM:0,fecha:'',nom:{}};
async function saveCarta(){
  try{localStorage.setItem('plazapatos-carta',JSON.stringify(CARTA))}catch(_){}
  if(db){try{await db.doc('config/carta').set(CARTA)}catch(e){toast('Datos guardados solo en este navegador')}}
}
const fechaLarga=f=>{const d=new Date((f||isoHoy())+'T12:00:00');return d.getDate()+' de '+MES[d.getMonth()].toLowerCase()+' de '+d.getFullYear()};
// ¿la casa está al corriente hasta el mes de corte?
function cartaEstado(r,mes){
  const mot=[];
  if(r.hist>0)mot.push(['Cuotas atrasadas de años anteriores',r.hist]);
  const v=sum(r.venc.filter(x=>x.i<=mes).map(x=>x.falta));if(v>0)mot.push([`Cuotas de ${CY} vencidas hasta ${MES[mes]}`,v]);
  const rc=sum(r.recM.filter(x=>x.i<=mes).map(x=>x.rec));if(rc>0)mot.push(['Recargo por morosidad',rc]);
  if(r.proyT>0)mot.push(['Proyectos pendientes',r.proyT]);
  if(r.ajT>0)mot.push(['Cargos adicionales',r.ajT]);
  return {ok:!mot.length,mot};
}
function docCarta(r){
  const nombre=(CS.nom[r.c]!==undefined?CS.nom[r.c]:((DIR[r.c]||{}).n||'')).trim();
  const fe=CS.fecha||isoHoy(),n=S.car.length+1;
  return {casa:r.c,nombre,mes:CS.mes,corte:`${MES[CS.mes]} ${CY}`,fe,fechaTxt:fechaLarga(fe),folio:`CNA-${CY}-${String(n).padStart(3,'0')}`,
    parr:[`Por medio de la presente, me permito informar que, después de haber hecho la revisión correspondiente a los meses anteriores y posteriores hasta el mes de ${MES[CS.mes].toLowerCase()} del año ${CY}, respecto del inmueble con número interior ${r.c} y a nombre de ${nombre||'________________'}, no se encontró adeudo alguno en concepto del pago de mantenimiento de dicho condominio.`,
      'Es así como, a petición del interesado(a), se extiende el documento.',
      'Sin más por el momento, agradezco su atención, quedando a sus órdenes para cualquier duda o aclaración que de la presente se pudiera derivar.']};
}
function cartaTexto(d){
  return [`${CARTA.cond}`,'CARTA DE NO ADEUDO',`${CARTA.ciudad} ${d.fechaTxt}`,'','A quien corresponda:','',...d.parr.flatMap(p=>[p,'']),'Atentamente,','',`${CARTA.firmante}${CARTA.tel?' ('+CARTA.tel+')':''}`,CARTA.cargo,CARTA.cond].join('\n');
}
function renderCarta(){
  const r=R.find(x=>x.c===S.casa)||R[0];
  const est=cartaEstado(r,CS.mes),d=docCarta(r);
  const nombre=d.nombre,listo=est.ok&&nombre;
  const log=[...S.car].sort((a,b)=>(b.ts||0)-(a.ts||0));
  $('#t-carta').innerHTML=casaBar(r)+`
  <div class="card" style="margin-bottom:16px"><h2 style="margin-top:0">Carta de no adeudo · casa ${r.c}</h2>
   <div class="form">
    <label class="f" style="grid-column:1/-1">Nombre del propietario o residente<input id="cnm" value="${esc(nombre)}" placeholder="Nombre completo" autocomplete="off"></label>
    <label class="f">Revisado hasta el mes de<select id="cmes">${MES.map((m,i)=>`<option value="${i}"${i===CS.mes?' selected':''}>${m} ${CY}</option>`).join('')}</select></label>
    <label class="f">Fecha de la carta<input id="cfe" type="date" value="${esc(CS.fecha||isoHoy())}"></label>
   </div>
   ${!nombre?'<div class="legend">Escribe el nombre para generar la carta. Si ya lo capturaste en el Directorio, aparece solo.</div>':''}
  </div>
  ${est.ok?`<div class="card" style="margin-bottom:16px;border-color:var(--good)"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between"><div><b>Sin adeudo</b> al corte de ${MES[CS.mes]} ${CY}. Se puede emitir la carta.</div>
    <div class="bar" style="margin:0"><button class="btn" data-cx="pdf"${listo?'':' disabled'}>Guardar PDF y registrar</button><button class="btn ghost" data-cx="copy"${listo?'':' disabled'}>Copiar texto</button></div></div></div>
   <div class="cp"><img class="lg" src="${CIRC0}" alt=""><div class="band">${esc(CARTA.cond)}</div>
    <h3>CARTA DE NO ADEUDO</h3><div class="dt">${esc(CARTA.ciudad)} ${esc(d.fechaTxt)}</div>
    <div class="bd"><div class="sd"><span>Dirección:</span>\n${esc(CARTA.dir)}</div>
     <div class="tx"><p>A quien corresponda:</p>${d.parr.map(p=>`<p>${esc(p)}</p>`).join('')}<p>Atentamente,</p>
      <div style="height:62px"></div><div class="ln"></div>
      <div class="nm">${esc(CARTA.firmante)}${CARTA.tel?' ('+esc(CARTA.tel)+')':''}<br>${esc(CARTA.cargo)}<br>${esc(CARTA.cond)}</div></div></div></div>`
  :`<div class="card" style="margin-bottom:16px;border-color:var(--crit)"><h2 style="margin-top:0;color:var(--crit)">No se puede emitir: la casa ${r.c} tiene adeudo</h2>
    <div class="sub" style="margin-bottom:8px">La carta solo se genera si no hay adeudo hasta el mes de corte (${MES[CS.mes]} ${CY}). Pendiente:</div>
    ${est.mot.map(([n,m])=>`<div class="line"><span>${esc(n)}</span><span class="num">${money(m)}</span></div>`).join('')}
    <div class="bar" style="margin:12px 0 0"><button class="btn" data-casa="${r.c}">Ver recibo de adeudo</button><button class="btn ghost" data-pay="${r.c}">Registrar un pago</button></div>
    <div class="legend">Si el adeudo es de meses posteriores al corte, cambia «Revisado hasta el mes de» para certificar solo lo anterior.</div></div>`}
  <details class="card" style="margin-bottom:16px"><summary style="cursor:pointer;font:700 17px var(--f-display)">Datos del condominio y del firmante</summary>
   <form id="carf" class="form" style="margin-top:12px">
    <label class="f" style="grid-column:1/-1">Nombre del condominio (encabezado)<input id="cac" value="${esc(CARTA.cond)}"></label>
    <label class="f">Ciudad<input id="cai" value="${esc(CARTA.ciudad)}"></label>

async function cartaLog(a){
  const [k,id]=a.split(':');
  if(k==='load'){const c=S.car.find(x=>x.id===id);if(c){S.casa=c.casa;CS.nom[c.casa]=c.nombre;CS.mes=Math.max(0,MES.indexOf(String(c.corte).split(' ')[0]));CS.fecha=c.fe}return render()}
  if(k==='del'){S.cdel=id;return render()}
  if(k==='del0'){S.cdel=null;return render()}
  if(k==='del2'){S.cdel=null;await delX('car',id);render();return toast('Registro eliminado')}
}
async function cartaAccion(a){
  const r=R.find(x=>x.c===S.casa)||R[0],d=docCarta(r);
  if(!cartaEstado(r,CS.mes).ok||!d.nombre)return toast('Falta el nombre o la casa tiene adeudo');
  if(a==='copy')return copyText(cartaTexto(d),'Carta copiada');
  if(a==='pdf'){
    const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return toast('No se pudo cargar el generador de PDF');
    const pdf=cartaPdf(J,d);
    await saveFile(`carta-no-adeudo-casa-${r.c}.pdf`,pdf.output('arraybuffer'));
    await addX('car',{folio:d.folio,casa:r.c,nombre:d.nombre,corte:d.corte,fe:d.fe,ts:Date.now()});
  }
}
function cartaPdf(J,d){
  const W=215.9,H=279.4,pdf=new J({unit:'mm',format:[W,H]}),AZ=[43,76,155],CO=[234,78,78],S_=pdfSafe;
  pdf.setFillColor(...CO);pdf.rect(52,0,W-52,24,'F');
  pdf.circle(34,26,25,'F');
  try{pdf.addImage(CIRC0,'PNG',11.5,3.5,45,45)}catch(_){}
  pdf.setTextColor(255,255,255);pdf.setFont('helvetica','bold');pdf.setFontSize(16);
  pdf.text(pdf.splitTextToSize(S_(CARTA.cond.toUpperCase()),W-66-10),64,14.5,{baseline:'middle'});
  pdf.setTextColor(...AZ);pdf.setFontSize(17);pdf.text('CARTA DE NO ADEUDO',66,52);
  pdf.setFillColor(...CO);pdf.rect(66,55,W-66-11,1.4,'F');
  pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.text(S_((CARTA.ciudad+' '+d.fechaTxt).toUpperCase()),W-11,63,{align:'right'});
  pdf.setFillColor(...CO);pdf.rect(11,72,46,1.4,'F');
  pdf.setFontSize(10);let y=81;pdf.text('Dirección:',11,y);
  for(const l of S_(CARTA.dir).split('\n')){y+=5;pdf.text(pdf.splitTextToSize(l,46),11,y)}
  const X=66,Wt=W-66-11;y=82;pdf.setFontSize(10.5);
  pdf.text('A quien corresponda:',X,y);y+=9;
  for(const p of d.parr){const L=pdf.splitTextToSize(S_(p),Wt);pdf.text(L,X,y);y+=L.length*5.2+5}
  y+=6;pdf.text('Atentamente,',X,y);y+=4;
  y+=24;pdf.setDrawColor(...AZ);pdf.setLineWidth(.3);pdf.line(X,y,X+60,y);y+=5;
  pdf.setFontSize(10);
  for(const l of [CARTA.firmante+(CARTA.tel?' ('+CARTA.tel+')':''),CARTA.cargo,CARTA.cond]){pdf.text(S_(l.toUpperCase()),X,y);y+=5}
  pdf.setFontSize(7.5);pdf.setTextColor(150,160,180);pdf.text('Folio '+d.folio,W-11,H-8,{align:'right'});
  return pdf;
}

  catch(_){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(__){}ta.remove();toast(ok?msg:'No se pudo copiar. Selecciona el texto manualmente.')}
}
async function saveFile(name,data){
  try{const dl=await claude.use('downloads');if(!dl)throw 0;await dl.save({filename:name,data});toast('Archivo listo');return}catch(_){}
  // en un navegador normal: descarga directa del archivo
  try{
    const tp=/\.pdf$/i.test(name)?'application/pdf':/\.png$/i.test(name)?'image/png':'text/csv;charset=utf-8';
    const u=URL.createObjectURL(new Blob([data],{type:tp}));
    const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Archivo descargado: '+name);return;
  }catch(_){}
  if(typeof data!=='string')return toast('La descarga no está disponible en esta vista');
  try{await navigator.clipboard.writeText(data);toast('Descarga no disponible. Contenido copiado al portapapeles')}catch(__){toast('No se pudo exportar')}
}
/* ---------- exportar ---------- */
async function exportCsv(){
  const L=filtered();
  const rows=[['Casa','Estado','Meses atrasados','Cuotas atrasadas','Proyectos pendientes','Meses vencidos '+NOW.getFullYear(),'Cuotas '+NOW.getFullYear(),'Recargo','Abonos','Total']];
  for(const r of L)rows.push([r.c,ESTADO[r.estado][0],r.histMeses,r.hist,r.proyT,r.venc.length,r.v26,r.recT,r.abT,r.total]);
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  return saveFile(`adeudos-plaza-patos-${NOW.toISOString().slice(0,10)}.csv`,csv);
}

const XC={ing:{ls:'plazapatos-ingresos',col:'ingresos'},aj:{ls:'plazapatos-ajustes',col:'ajustes'},car:{ls:'plazapatos-cartas',col:'cartas'}};
const xcol={};
function xlsLoad(n){try{return JSON.parse(localStorage.getItem(XC[n].ls)||'[]')}catch(_){return[]}}
function xlsSave(n){try{localStorage.setItem(XC[n].ls,JSON.stringify(S[n]))}catch(_){}}
async function addX(n,o){
  if(xcol[n]){try{await xcol[n].add(o);return}catch(e){toast('No se pudo guardar en la nube. Guardado en este navegador.')}}
  o.id='l'+Date.now()+Math.random().toString(36).slice(2,5);S[n].push(o);xlsSave(n);render();
}
async function updX(n,id,o){
  if(xcol[n]&&!String(id).startsWith('l')){try{await db.doc(XC[n].col+'/'+id).set(o);return}catch(e){toast('No se pudo actualizar');return}}
  S[n]=S[n].map(x=>x.id===id?{...o,id}:x);xlsSave(n);
}
async function delX(n,id){
  if(xcol[n]&&!String(id).startsWith('l')){try{await db.doc(XC[n].col+'/'+id).delete();return}catch(e){toast('No se pudo eliminar');return}}
  S[n]=S[n].filter(x=>x.id!==id);xlsSave(n);render();
}
async function saveBase(){
  try{localStorage.setItem('plazapatos-base',JSON.stringify(BASE))}catch(_){}
  if(db){try{await db.doc('config/base').set(BASE)}catch(e){toast('Guardado solo en este navegador')}}
}
async function saveCfg(){
  try{localStorage.setItem('plazapatos-cfg',JSON.stringify(CFG))}catch(_){}
  if(db){try{await db.doc('config/reglas').set(CFG)}catch(e){toast('Reglas guardadas solo en este navegador')}}
}
async function initStore(){
  S.pagos=lsLoad();S.gastosX=lsGLoad();S.ing=xlsLoad('ing');S.aj=xlsLoad('aj');S.car=xlsLoad('car');
  try{const b=JSON.parse(localStorage.getItem('plazapatos-base')||'null');if(b)BASE={...BASE,...b}}catch(_){}
  try{const c=JSON.parse(localStorage.getItem('plazapatos-cfg')||'null');if(c)CFG={...CFG,...c};applyCfg()}catch(_){}
  try{const c=JSON.parse(localStorage.getItem('plazapatos-info')||'null');if(c){INFO=c;applyInfo()}}catch(_){}
  try{const c=JSON.parse(localStorage.getItem('plazapatos-dir')||'null');if(c)DIR=c}catch(_){}
  try{const c=JSON.parse(localStorage.getItem('plazapatos-carta')||'null');if(c){delete c.firma;CARTA={...CARTA,...c}}}catch(_){}
  try{const n=+localStorage.getItem('plazapatos-extra');if(n>0)applyExtra(n)}catch(_){}
  try{
    const c=window.claude&&await claude.use('db');
    if(c){
      db=c;pagosCol=c.collection('pagos');S.store='db';S.pagos=[];
      db.doc('config/reglas').onSnapshot(s=>{if(s.exists){CFG={...CFG,...s.data()};applyCfg();render()}},()=>{});
      for(const n of ['ing','aj','car']){xcol[n]=c.collection(XC[n].col);S[n]=[];xcol[n].onSnapshot(s=>{S[n]=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{xcol[n]=null;S[n]=xlsLoad(n);render()})}
      db.doc('config/casas').onSnapshot(s=>{if(s.exists){INFO=(s.data()||{}).m||{};applyInfo();render()}},()=>{});
      db.doc('config/extras').onSnapshot(s=>{if(s.exists){const n=+(s.data()||{}).n||0;if(n!==EXTRA){applyExtra(n);render()}}},()=>{});
      db.doc('config/carta').onSnapshot(s=>{if(s.exists){CARTA={...CARTA,...(s.data()||{})};render()}},()=>{});
      db.doc('config/directorio').onSnapshot(s=>{if(s.exists){DIR=(s.data()||{}).m||{};render()}},()=>{});
      db.doc('config/base').onSnapshot(s=>{if(s.exists){BASE={...BASE,...s.data()};render()}},()=>{});
      gastosCol=c.collection('gastos');S.gastosX=[];
      gastosCol.onSnapshot(s=>{S.gastosX=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{gastosCol=null;S.gastosX=lsGLoad();render()});
      pagosCol.onSnapshot(s=>{S.pagos=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{S.store='local';pagosCol=null;S.pagos=lsLoad();render()});
    }
  }catch(_){}
  render();
}

(function(){
  const h=(location.hash||'').slice(1);
  if(TABS.some(t=>t[0]===h))S.tab=h;
  render();initStore();
})();
